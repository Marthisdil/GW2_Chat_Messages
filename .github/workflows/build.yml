name: Build

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    # A normal run takes 7-12 minutes; a stuck one is cancelled instead of
    # running for GitHub's default 6 hours.
    timeout-minutes: 30
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild GW2_Chat_Messages.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64

      - name: Check GetAddonDef export
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $exports = & $dumpbin.FullName /exports "build\${{ matrix.configuration }}\GW2_Chat_Messages.dll"
          $exports
          if (-not ($exports -match '\bGetAddonDef\b')) { throw "GetAddonDef is not exported" }

      - name: Unit tests
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\run_tests.ps1

      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: GW2_Chat_Messages
          path: build/Release/GW2_Chat_Messages.dll

      # The clang part of the security audit (docs/security-audit.md) on all of src\ and tests\.
      # It needs the Release build (the build stamp header). LLVM is on the runner image.
      - name: Clang audit
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\run_audit.ps1 -Tests

      - uses: actions/upload-artifact@v4
        if: always() && matrix.configuration == 'Release'
        with:
          name: clang-audit
          path: build/audit/
          if-no-files-found: ignore
